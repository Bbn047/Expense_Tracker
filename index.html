<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--box icon stylesheet-->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!---custom css-->
    <link rel="stylesheet" href="./styles/index.css">
</head>

<body>


    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container-fluid custom-nav">
            <a class="navbar-brand" href="#">Expense Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#"><i class='bx bxs-home'
                                style='color:#f3f2ec'></i></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class='bx bx-bar-chart-alt' style='color:#f3f2ec'></i></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class='bx bxs-cog' style='color:#f3f2ec'></i></a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle p-0" href="#" data-bs-toggle="dropdown" role="button"
                            aria-expanded="false">
                            <img src="./assets/images/profile.png" width="32" height="32" class="rounded-circle">
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end custom-menu">
                            <li><a class="dropdown-item" href="#">name</a></li>
                            <li><a class="dropdown-item" href="#">email</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#" id="logoutBtn">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>



    <!---------main section------------------>
    <div class="main-container">
        <section class="status-bar">
            <div class="top-section">
                <!-----income section------>
                <div class="income-items top-box">
                    <div class="heading">
                        <i class='bx bxs-wallet fs-3' style='color:#087d00'></i>
                        <h6 class="fs-3">Income</h6>
                    </div>
                    <div class="money income">
                        <!-- income shown here -->
                        <p>$<span></span></p>
                    </div>
                </div>

                <!-----expense section-------------->
                <div class="expense-items top-box">
                    <div class="heading">
                        <i class='bx bx-trending-down fs-3' style='color:#e62a2a'></i>
                        <h6 class="fs-3">Expense</h6>
                    </div>
                    <div class="money expense">
                        <!-- expense show here -->
                        <p>$<span> </span></p>
                    </div>
                </div>
            </div>
            <!------net balance after expense------------>
            <div class="balance">
                <div class="net-balance">
                    <div class="total-balance">
                        <!-- available balance show here -->
                        <p>Net Balance: $<span></span></p>
                    </div>
                </div>
            </div>
        </section>

        <section class="main-content">
            <div class="wrapper">
                <!------add transtions income & expense-------->
                <div class="add-transactions col one">
                    <h6>Add Transactions</h6>
                    <div class="add-items">
                        <form action="#" id="transaction-form" class="transaction-inputs">

                            <div class="form-items">
                                <input type="date" class="input-field" id="date" required>

                                <input type="text" class="input-field" id="description" placeholder="Description"
                                    required>

                                <select id="category" class="input-field" required>
                                    <option value="" disabled selected>category</option>
                                    <option>Income</option>
                                    <option>Expense</option>
                                </select>

                                <input type="number" class="input-field" id="amount" placeholder="Amount" min="0"
                                    step="0.01" required>
                            </div>

                            <div class="transaction-button">
                                <button type="submit" class="one-btn add">Add</button>
                                <button type="reset" class="one-btn clear">Clear</button>
                            </div>

                        </form>
                    </div>
                </div>

                <!------------- graph  ------------>
                <div class="summary col two">
                    <h6>Spending Breakdown</h6>

                    <!------- graph section  ------>
                    <div class="graph-section">
                        <div class="graph">
                            <canvas id="myChart"></canvas>
                        </div>
                        <div class="chart-indicator">
                            <div class="indicator">
                                <span class="dot income"></span>
                                <p class="ch-income">Income : <span></span></p>
                            </div>
                            <div class="indicator">
                                <span class="dot expense"></span>
                                <p class="ch-expense">Expense : <span></span></p>
                            </div>
                        </div>
                    </div>
                    <!-- filter -->
                    <div class="chart-filters">
                        <select id="filter-month">
                            <option value="" disabled selected>All Months</option>
                            <option value="0">Jan</option>
                            <option value="1">Feb</option>
                            <option value="2">Mar</option>
                            <option value="3">Apr</option>
                            <option value="4">May</option>
                            <option value="5">Jun</option>
                            <option value="6">Jul</option>
                            <option value="7">Aug</option>
                            <option value="8">Sep</option>
                            <option value="9">Oct</option>
                            <option value="10">Nov</option>
                            <option value="11">Dec</option>
                        </select>

                        <select id="filter-year"> year</select>
                    </div>

                </div>

                <!------------- Transactions list --------------------->
                <div class="transaction-list col three">
                    <h6>Transation List</h6>
                    <div class="transaction-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Description</th>
                                    <th>Category</th>
                                    <th>Amount</th>
                                    <th></th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- js add data in table -->

                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </section>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./js/graph.js"></script>
    <script src="./js/script.js"></script>
</body>

</html>
